version: "3.9"

services:
  e2e-test:
    build:
      context: .
      dockerfile: tests/Dockerfile.e2e
    container_name: novacart-e2e
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_healthy
    environment:
      API_URL: http://server:5001
      CLIENT_URL: http://client:80
    volumes:
      - ./tests/reports:/app/reports
