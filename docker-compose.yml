version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: novacart-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: novacart
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: novacart-server
    restart: unless-stopped
    ports:
      - "5001:5001"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5001
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/novacart
      JWT_SECRET: ${JWT_SECRET:-novacart_docker_jwt_secret_change_me}
      JWT_EXPIRE: 7d
      FRONTEND_URL: http://localhost:3000
      LOGIN_RATE_LIMIT_MAX: 100
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: novacart-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  mongo_data:
    driver: local
