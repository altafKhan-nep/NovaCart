<style>
        .bounce-in {
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.6s ease-out forwards;
        }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
    </style>
</head>
<body class="bg-background min-h-screen font-body-md text-on-surface relative overflow-x-hidden">
<!-- 3D Confetti Background -->
<div class="fixed inset-0 z-0 pointer-events-none opacity-50">

</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center min-h-screen p-margin-mobile md:p-margin-desktop max-w-container-max mx-auto">
<!-- Success Icon -->
<div class="bounce-in bg-secondary-container text-on-secondary-container rounded-full w-24 h-24 flex items-center justify-center mb-gutter shadow-[0px_8px_30px_rgba(94,246,230,0.4)]">
<span class="material-symbols-outlined text-[48px]" data-icon="check_circle">check_circle</span>
</div>
<!-- Header -->
<h1 class="fade-up font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary text-center mb-base">Thank You!</h1>
<p class="fade-up delay-100 font-body-lg text-body-lg text-on-surface-variant text-center mb-gutter max-w-md">Your order has been placed successfully. Get ready for some joy to arrive at your door.</p>
<!-- Order Summary Card -->
<div class="fade-up delay-200 bg-surface-container-lowest rounded-[32px] p-gutter w-full max-w-lg shadow-[0px_4px_20px_rgba(164,60,18,0.05)] border border-surface-container-high mb-margin-desktop relative overflow-hidden">
<!-- Decorative Blobs -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-fixed-dim rounded-full blur-3xl opacity-20 -mr-16 -mt-16"></div>
<div class="absolute bottom-0 left-0 w-32 h-32 bg-secondary-fixed-dim rounded-full blur-3xl opacity-20 -ml-16 -mb-16"></div>
<div class="relative z-10">
<div class="flex justify-between items-center mb-gutter pb-base border-b border-surface-container-high">
<span class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider">Order Number</span>
<span class="font-headline-md text-headline-md text-primary">#NC-84920</span>
</div>
<div class="space-y-base mb-gutter">
<div class="flex items-center gap-base">
<div class="w-16 h-16 rounded-xl bg-surface-container overflow-hidden flex-shrink-0">
<img class="w-full h-full object-cover" data-alt="A brightly lit, minimal product shot of a sleek, modern, coral-colored smart home speaker on a clean cream background. The aesthetic is soft and organic with subtle colorful lighting accents." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCfxDXhGyga0Brimu9QU4MZSk7W9P8VL2vvoPQsZG_eni8Sz1EP3xRUqs57-AatdtWK4e2FFoxM7XEGz24Mr_obfArNrrZ_8ZGVYdFjwgI0CysFhQkyQFzzklbkTFg0U1ApHCyH3IDSBnP8zom2WAZBH6znBwqrMGT4i3Ry04XB6ywAKY0TqdBaeeKbzHTiuNhh-FKZuJ_jHvVJ3_p3VoGEpkmMN8Kt6AY6-mC8wy8rsuv-oc3ps5SECw"/>
</div>
<div class="flex-grow">
<h3 class="font-headline-md text-headline-md text-on-surface">Echo Aura Speaker</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Qty: 1</p>
</div>
<div class="font-label-bold text-label-bold text-on-surface">$129.00</div>
</div>
</div>
<div class="space-y-2 pt-base border-t border-surface-container-high">
<div class="flex justify-between text-on-surface-variant">
<span>Subtotal</span>
<span>$129.00</span>
</div>
<div class="flex justify-between text-on-surface-variant">
<span>Shipping</span>
<span>Free</span>
</div>
<div class="flex justify-between items-center mt-base pt-base border-t border-surface-container-high">
<span class="font-headline-md text-headline-md text-on-surface">Total</span>
<span class="font-headline-md text-headline-md text-primary">$129.00</span>
</div>
</div>
</div>
</div>
<!-- Actions -->
<div class="fade-up delay-300 flex flex-col sm:flex-row gap-base w-full max-w-sm">
<button class="flex-1 bg-gradient-to-r from-primary-container to-primary text-on-primary-container rounded-full py-3 px-6 font-label-bold text-label-bold shadow-[0px_4px_20px_rgba(255,127,80,0.3)] hover:scale-105 hover:shadow-[0px_8px_30px_rgba(255,127,80,0.4)] transition-all duration-200 flex items-center justify-center gap-2">
                Continue Shopping
                <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="flex-1 bg-transparent border-2 border-outline-variant text-on-surface-variant rounded-full py-3 px-6 font-label-bold text-label-bold hover:bg-surface-container hover:text-on-surface transition-all duration-200">
                View Receipt
            </button>
</div>
